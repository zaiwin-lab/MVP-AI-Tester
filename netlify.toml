# Netlify config for the KAPT Digital Clinic static front-end demo.
# The app is exported as a static site (next.config: output "export") to /out,
# so this is a plain static deploy — no server runtime, no plugin needed.
# (The parked backend under /parked-backend is for the tech team's later build.)

[build]
  command = "npm run build"
  publish = "out"
